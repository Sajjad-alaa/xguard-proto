syntax = "proto3";
package xguard.proxy.v2;

import "common/client_types.proto";
import "google/protobuf/empty.proto";
import "v2/common.proto";

// Password Reset (proxy-internal)

message PasswordResetInitializeRequest {
  string email = 1;
}

message PasswordResetStartRequest {
  string token = 1;
}

message PasswordResetStartResponse {
  int64 deadline_timestamp = 1;
}

message PasswordResetRequest {
  string password = 1;
  optional string token = 2;
}

message ClientMfaTokenValidationRequest {
  string token = 1;
}

message ClientMfaTokenValidationResponse {
  bool token_valid = 1;
}

message AuthInfoResponse {
  string url = 1;
  string csrf_token = 2;
  string nonce = 3;
  optional string button_display_name = 4;
  xguard.client_types.OpenIdProviderKind provider_kind = 5;
}

message AuthCallbackRequest {
  string code = 1;
  string nonce = 2;
}

message AuthCallbackResponse {
  string url = 1;
  string token = 2;
}

message ClientMfaOidcAuthenticateRequest {
  string code = 1;
  string state = 2;
  string nonce = 3;
}

// Common client info
message DeviceInfo {
  string ip_address = 1;
  optional string user_agent = 2;
  optional string version = 3;
  optional string platform = 4;
}

message AwaitRemoteMfaFinishRequest {
  string token = 1;
}

// LEGACY/FROZEN: preserve this message's wire contract for deployed clients.
message AwaitRemoteMfaFinishResponse {
  string preshared_key = 1;
}

message InitialInfo {
  bytes private_cookies_key = 1;
}

/*
 * Error response variant.
 * The proxy-to-core stream is reversed, so core returns gRPC errors
 * through this message.
 */
message CoreError {
  int32 status_code = 1;
  string message = 2;
  CoreErrorCode code = 3;
}

/*
 * Reasons for a CoreError. UNSPECIFIED means core sent no code,
 * so the proxy falls back to a generic message.
 */
enum CoreErrorCode {
  CORE_ERROR_CODE_UNSPECIFIED = 0;
  // The user signed in to the identity provider with another account.
  CORE_ERROR_CODE_OIDC_ACCOUNT_MISMATCH = 1;
  // Core could not verify the identity provider's response.
  CORE_ERROR_CODE_OIDC_VERIFICATION_FAILED = 2;
  // The MFA session or attempt no longer exists or was already used.
  CORE_ERROR_CODE_MFA_SESSION_EXPIRED = 3;
  // Core could not process the request because SMTP is not configured.
  CORE_ERROR_CODE_SMTP_NOT_CONFIGURED = 4;
}

/*
 * CoreResponse represents messages sent from core to proxy
 * in response to CoreRequest.
 */
message CoreResponse {
  // Removed with Defguard enterprise code (XGuard is AGPL-only).
  reserved 19, 20;
  reserved "device_posture_check", "device_posture_rejected";
  uint64 id = 1;
  oneof payload {
    google.protobuf.Empty empty = 2;
    xguard.client_types.EnrollmentStartResponse enrollment_start = 3;
    xguard.client_types.DeviceConfigResponse device_config = 4;
    PasswordResetStartResponse password_reset_start = 5;
    xguard.client_types.ClientMfaStartResponse client_mfa_start = 6;
    xguard.client_types.ClientMfaFinishResponse client_mfa_finish = 7;
    CoreError core_error = 8;
    xguard.client_types.InstanceInfoResponse instance_info = 9;
    AuthInfoResponse auth_info = 10;
    AuthCallbackResponse auth_callback = 11;
    ClientMfaTokenValidationResponse client_mfa_token_validation = 12;
    xguard.client_types.CodeMfaSetupStartResponse code_mfa_setup_start_response = 13;
    xguard.client_types.CodeMfaSetupFinishResponse code_mfa_setup_finish_response = 14;
    InitialInfo initial_info = 15;
    AwaitRemoteMfaFinishResponse await_remote_mfa_finish = 16;
    HttpsCerts https_certs = 17;
    google.protobuf.Empty clear_https_certs = 18;
    PublicSettings public_settings = 21;
    xguard.client_types.MfaConfigStartResponse mfa_config_start = 23;
    xguard.client_types.MfaConfigAuthorizeResponse mfa_config_authorize = 24;
    xguard.client_types.MfaConfigSendCodeResponse mfa_config_send_code = 25;
    xguard.client_types.MfaConfigFido2ChallengeResponse mfa_config_fido2_challenge = 26;
    xguard.client_types.MfaFlowStartResponse mfa_flow_start = 27;
    xguard.client_types.MfaFlowStepStartResponse mfa_flow_step_start = 28;
    xguard.client_types.MfaFlowStepFinishResponse mfa_flow_step_finish = 29;
    xguard.client_types.MfaFlowRemoteResponse mfa_flow_remote = 30;
  }
}

message HttpsCerts {
  string cert_pem = 1;
  string key_pem = 2;
}

message PublicSettings {
  bool display_password_reset = 1;
  bool display_download_step = 2;
  // Public URL used to reach the Edge component.
  optional string public_url = 3;
}

/*
 * Sent from core to proxy to trigger ACME HTTP-01 certificate issuance.
 */
message AcmeChallenge {
  string domain = 1;
  // JSON-serialized instant-acme AccountCredentials; empty string means create a new account.
  string account_credentials_json = 2;
}

/*
 * Sent from proxy to core after ACME certificate issuance completes.
 */
message AcmeCertificate {
  string cert_pem = 1;
  string key_pem = 2;
  // JSON-serialized instant-acme AccountCredentials for reuse on renewal.
  string account_credentials_json = 3;
}

/*
 * Progress steps emitted by the proxy during ACME HTTP-01 certificate issuance.
 * Streamed as AcmeIssueEvent payloads before the final AcmeCertificate.
 */
enum AcmeStep {
  ACME_STEP_UNSPECIFIED = 0;
  ACME_STEP_CONNECTING = 1;
  ACME_STEP_VALIDATING_DOMAIN = 2;
  ACME_STEP_ISSUING_CERTIFICATE = 3;
  ACME_STEP_CHECKING_DOMAIN = 4;
}

message AcmeProgress {
  AcmeStep step = 1;
}

/*
 * Log lines collected by the proxy during ACME certificate issuance.
 * Sent once on failure, immediately before the gRPC error status.
 */
message AcmeLogs {
  repeated string lines = 1;
}

/*
 * Wrapper message streamed by TriggerAcme.
 * Carries either a progress update, the final certificate, or (on failure)
 * the collected proxy log lines.
 */
message AcmeIssueEvent {
  oneof payload {
    AcmeProgress progress = 1;
    AcmeCertificate certificate = 2;
    AcmeLogs logs = 3;
  }
}

/*
 * CoreRequest represents messages sent from proxy to core.
 */
message CoreRequest {
  // Removed with Defguard enterprise code (XGuard is AGPL-only).
  reserved 22;
  reserved "device_posture_check";
  uint64 id = 1;
  DeviceInfo device_info = 2;
  oneof payload {
    xguard.client_types.EnrollmentStartRequest enrollment_start = 3;
    xguard.client_types.ActivateUserRequest activate_user = 4;
    xguard.client_types.NewDevice new_device = 5;
    xguard.client_types.ExistingDevice existing_device = 6;
    PasswordResetInitializeRequest password_reset_init = 7;
    PasswordResetStartRequest password_reset_start = 8;
    PasswordResetRequest password_reset = 9;
    xguard.client_types.ClientMfaStartRequest client_mfa_start = 10;
    xguard.client_types.ClientMfaFinishRequest client_mfa_finish = 11;
    xguard.client_types.InstanceInfoRequest instance_info = 12;
    xguard.client_types.AuthInfoRequest auth_info = 13;
    AuthCallbackRequest auth_callback = 14;
    ClientMfaOidcAuthenticateRequest client_mfa_oidc_authenticate = 15;
    xguard.client_types.RegisterMobileAuthRequest register_mobile_auth = 16;
    ClientMfaTokenValidationRequest client_mfa_token_validation = 17;
    xguard.client_types.CodeMfaSetupStartRequest code_mfa_setup_start = 18;
    xguard.client_types.CodeMfaSetupFinishRequest code_mfa_setup_finish = 19;
    AwaitRemoteMfaFinishRequest await_remote_mfa_finish = 20;
    AcmeCertificate acme_certificate = 21;
    xguard.client_types.MfaConfigStartRequest mfa_config_start = 24;
    xguard.client_types.MfaConfigAuthorizeRequest mfa_config_authorize = 25;
    xguard.client_types.MfaConfigSendCodeRequest mfa_config_send_code = 26;
    xguard.client_types.MfaConfigEndRequest mfa_config_end = 27;
    xguard.client_types.MfaConfigFido2ChallengeRequest mfa_config_fido2_challenge = 28;
    xguard.client_types.MfaFlowStartRequest mfa_flow_start = 29;
    xguard.client_types.MfaFlowStepStartRequest mfa_flow_step_start = 30;
    xguard.client_types.MfaFlowStepFinishRequest mfa_flow_step_finish = 31;
    xguard.client_types.MfaFlowRemoteRequest mfa_flow_remote = 32;
    xguard.client_types.MfaFlowApproveRequest mfa_flow_approve = 33;
  }
}

service Proxy {
  /*
   * Bi-directional communication between core and proxy.
   * For security reasons, the connection has to be initiated by core,
   * so requests and responses are actually sent in reverse.
   */
  rpc Bidi(stream CoreResponse) returns (stream CoreRequest);
  /*
   * Purges existing on-disk gRPC TLS credentials and signals the server
   * to re-enter setup mode so that core can provision new ones.
   */
  rpc Purge(google.protobuf.Empty) returns (google.protobuf.Empty);
  /*
   * Triggers ACME HTTP-01 certificate issuance directly on the proxy.
   * Streams progress events followed by the issued certificate.
   */
  rpc TriggerAcme(AcmeChallenge) returns (stream AcmeIssueEvent);
}

// Service used during initial Proxy setup to configure the TLS certificate
// for gRPC communication.
service ProxySetup {
  rpc Start(google.protobuf.Empty) returns (stream xguard.common.v2.LogEntry);
  rpc GetCsr(xguard.common.v2.CertificateInfo) returns (xguard.common.v2.DerPayload);
  rpc SendCert(xguard.common.v2.CertBundle) returns (google.protobuf.Empty);
}
