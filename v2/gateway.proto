syntax = "proto3";
package xguard.gateway.v2;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "v2/common.proto";
import "v2/firewall.proto";

/*
 * Networking and VPN configuration send from Core to Gateway.
 */
message Configuration {
  // Removed with Defguard enterprise code (XGuard is AGPL-only).
  reserved 6;
  reserved "firewall_config";
  string name = 1;
  string private_key = 2;
  uint32 port = 3;
  repeated Peer peers = 4;
  repeated string addresses = 5;
  uint32 mtu = 7;
  uint32 fwmark = 8;
  // XGuard firewall for this location; unset means the firewall is off.
  optional FirewallPolicy firewall = 9;
}

enum UpdateType {
  UPDATE_TYPE_UNSPECIFIED = 0;
  UPDATE_TYPE_CREATE = 1;
  UPDATE_TYPE_MODIFY = 2;
  UPDATE_TYPE_DELETE = 3;
}

message Peer {
  string pubkey = 1;
  repeated string allowed_ips = 2;
  optional string preshared_key = 3;
  optional uint32 keepalive_interval = 4;
}

message Update {
  // Removed with Defguard enterprise code (XGuard is AGPL-only).
  reserved 4;
  reserved "firewall_config";
  UpdateType update_type = 1;
  oneof update {
    Peer peer = 2;
    Configuration network = 3;
    // Turns the firewall off; NAT stays.
    google.protobuf.Empty disable_firewall = 5;
    // Replaces the firewall policy (and turns the firewall on).
    FirewallPolicy firewall = 6;
  }
}

message PeerStats {
  string public_key = 1;
  string endpoint = 2;
  uint64 upload = 3;
  uint64 download = 4;
  uint32 keepalive_interval = 5;
  optional google.protobuf.Timestamp latest_handshake = 6;
  string allowed_ips = 7;
}

/*
 * CoreResponse represents messages send from Core to Gateway
 * in response to CoreRequest.
 */
message CoreResponse {
  uint64 id = 1;
  oneof payload {
    // Allow empty messages to keep the connection alive.
    google.protobuf.Empty empty = 2;
    Configuration config = 3;
    Update update = 4;
  }
}

/*
 * CoreRequest represents messages send from Gateway to Core.
 */
message CoreRequest {
  uint64 id = 1;
  oneof payload {
    PeerStats peer_stats = 2;
    google.protobuf.Empty config_request = 3;
  }
}

service Gateway {
  /*
   * Bi-directional communication between Core and Gateway.
   * For security reasons, the connection has to be initiated by Core,
   * so requests and responses are actually sent in reverse.
   */
  rpc Bidi(stream CoreResponse) returns (stream CoreRequest);
  /*
   * Purges existing on-disk gRPC TLS credentials and signals the server
   * to re-enter setup mode so that core can provision new ones.
   */
  rpc Purge(google.protobuf.Empty) returns (google.protobuf.Empty);
}

// Service used for initial Gateway setup, for configuring TLS certificate
// on Gateway for gRPC communication.
service GatewaySetup {
  rpc Start(google.protobuf.Empty) returns (stream xguard.common.v2.LogEntry);
  rpc GetCsr(xguard.common.v2.CertificateInfo) returns (xguard.common.v2.DerPayload);
  rpc SendCert(xguard.common.v2.CertBundle) returns (google.protobuf.Empty);
}
